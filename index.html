<!DOCTYPE html>
<html>
    <head>
        <title>
            Pomodoro TImer
        </title>
        <link rel="stylesheet" type="text/css" href="styles.css">
        <script src="client.js" defer> </script>
    </head>
    <body>
        <div class="root">
            <div class="timer">
                <h1 class="timer-h1">00:01</h1>
            </div>
            <div class="control-buttons">
                <button class="start-button">Start</button>
                <button class="pause-button">Pause</button>
                <button class="reset-button">Reset</button>
            </div>
            <div class="session-label">
                <input class="session-label-input" placeholder="Session Label">
            </div>
            <div class="session-logs">
                <h4 class="completed-session">Completed Sessions</h4>
                <div class="sessions">
                    <div class="session">
                        <div class="session-name-color">
                            <div class="random-color"></div>
                            <div class="session-name">Deep work - Project Sakuga</div>
                        </div>
                        <div class="session-time">25 min</div>
                        <div class="completed-time">2 minutes ago</div>
                    </div>
                    <div class="session">
                        <div class="session-name-color">
                            <div class="random-color"></div>
                            <div class="session-name">Reading - System Design</div>
                        </div>
                        <div class="session-time">25 min</div>
                        <div class="completed-time">4 hours ago</div>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
